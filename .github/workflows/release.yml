name: Release

# A tag is the release trigger. The tag must match package.json; the image is published only
# after the full verification suite passes, so a tag can never publish an untested artefact.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Match the tag to the package version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a semantic version"
            exit 1
          fi

          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag '$tag' does not match package.json version '$package_version'"
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            channel="prerelease"
          else
            channel="stable"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Releasing $version ($channel) from $tag" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Full verification
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      # `verify` uses the availability-tolerant audit so a third-party outage does not make CI
      # red. A release is different: it must not publish without a real audit result.
      - name: Strict security audit
        run: npm run security:audit:strict

  publish:
    name: Publish image
    needs: [validate, quality]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires a lowercase repository path. The owner is preserved elsewhere, but the
      # image name is normalised here rather than documented as a manual convention.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rackdeck" >> "$GITHUB_ENV"

      - name: Set build timestamp
        id: build
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Exactly one immutable version tag. No `latest`, no moving major/minor alias.
          tags: ${{ env.IMAGE }}:${{ needs.validate.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            APP_REVISION=${{ github.sha }}
            APP_CHANNEL=${{ needs.validate.outputs.channel }}
            APP_SOURCE=https://github.com/${{ github.repository }}
            APP_CREATED=${{ steps.build.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest on the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-body.md"

          if gh release view "$TAG" --json body --jq .body > "$body_file" 2>/dev/null; then
            {
              echo ""
              echo "## Container image"
              echo ""
              echo '```'
              echo "${IMAGE}:${VERSION}"
              echo "digest: ${DIGEST}"
              echo '```'
              echo ""
              echo "The image is signed by GitHub's build provenance attestation. Verify it with:"
              echo ""
              echo '```'
              echo "docker buildx imagetools inspect ${IMAGE}:${VERSION}"
              echo '```'
            } >> "$body_file"
            gh release edit "$TAG" --notes-file "$body_file"
          else
            {
              echo "Container image: \`${IMAGE}:${VERSION}\`"
              echo ""
              echo "Digest: \`${DIGEST}\`"
            } > "$body_file"
            gh release create "$TAG" --title "$TAG" --notes-file "$body_file"
          fi

          echo "Published ${IMAGE}:${VERSION} (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"

  assets:
    name: Publish release assets
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rackdeck" >> "$GITHUB_ENV"

      - name: Generate the release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          node scripts/release-assets.mjs \
            --version "$VERSION" \
            --image "${IMAGE}:${VERSION}" \
            --digest "$DIGEST" \
            --repository "$GITHUB_REPOSITORY" \
            --out release-assets
          ls -l release-assets
          cat release-assets/release.json
          cat release-assets/SHA256SUMS

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            release-assets/install.sh \
            release-assets/compose.yaml \
            release-assets/casaos-compose.yaml \
            release-assets/get.sh \
            release-assets/docker-run.txt \
            release-assets/release.json \
            release-assets/SHA256SUMS \
            --clobber

      - name: Verify the published assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/verify-assets"
          mkdir -p "$verify_dir"
          cd "$verify_dir"
          for asset in install.sh compose.yaml casaos-compose.yaml get.sh docker-run.txt release.json SHA256SUMS; do
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}" -o "$asset"
          done
          sha256sum -c SHA256SUMS
          printf 'Release assets verified for %s\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
