name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        # Unit, integration and contract suites. The integration and contract suites drive
        # the real Express app on an ephemeral port, so no external service is needed.
        run: npm test

      - name: Build
        run: npm run build

      - name: Shell syntax
        run: bash -n scripts/install.sh && bash -n scripts/get.sh

      - name: ShellCheck
        run: shellcheck --version && shellcheck scripts/install.sh scripts/get.sh

      - name: Compose contract
        env:
          HOMELABMD_IMAGE_TAG: 1.0.0
        run: docker compose -f infra/compose.yaml config >/dev/null

      - name: Release assets dry run
        run: |
          set -euo pipefail
          node scripts/release-assets.mjs \
            --version 0.0.0-test \
            --image ghcr.io/kaquely/rackdeck:0.0.0-test \
            --digest "sha256:$(printf '0%.0s' {1..64})" \
            --repository "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum -c SHA256SUMS)

      - name: Security audit
        run: npm run security:audit
